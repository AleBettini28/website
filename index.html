<!doctype html>
<html lang="it">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Alessandro Bettini applications</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --bg: #fafaf9;
                --text: #292524;
                --muted: #57534e;
                --outdoor: #b45309;
                --outdoor-hover: #92400e;
                --dnd: #c4b583;
                --dnd-hover: #b3a472;
                --fortnite: #8b5cf6;
                --fortnite-hover: #7c3aed;
                --gamedev: #0f766e;
                --gamedev-hover: #0d5f59;
                --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            }

            html,
            body {
                height: 100%;
            }

            body {
                font-family:
                    ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
                    "Segoe UI Symbol", "Noto Color Emoji";
                background-color: var(--bg);
                color: var(--text);
                line-height: 1.5;
                -webkit-font-smoothing: antialiased;
            }

            main {
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1rem;
            }

            .panel {
                width: 100%;
                max-width: 48rem;
                text-align: center;
            }

            h1 {
                font-size: 1.875rem;
                font-weight: 700;
                letter-spacing: -0.025em;
                color: #292524;
                margin-bottom: 1.25rem;
            }

            .hero {
                display: block;
                width: 100%;
                max-width: 28rem;
                max-height: 16rem;
                margin: 0 auto 1.5rem;
                object-fit: cover;
                border-radius: 0.5rem;
                box-shadow: var(--shadow);
                background: #e7e5e4;
            }

            .subtitle {
                color: var(--muted);
                font-size: 0.875rem;
                margin-bottom: 2.5rem;
            }

            .links {
                display: flex;
                flex-direction: column;
                gap: 1rem;
                justify-content: center;
            }

            .link {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.75rem;
                padding: 1rem 1.5rem;
                border-radius: 0.5rem;
                font-weight: 600;
                text-decoration: none;
                box-shadow: var(--shadow);
                transition: background-color 0.15s ease;
            }

            .link svg {
                width: 1.25rem;
                height: 1.25rem;
                flex-shrink: 0;
            }

            .link-outdoor {
                background: var(--outdoor);
                color: #fff;
            }

            .link-outdoor:hover {
                background: var(--outdoor-hover);
            }

            .link-dnd {
                background: var(--dnd);
                color: #1c1917;
            }

            .link-dnd:hover {
                background: var(--dnd-hover);
            }

            .link-fortnite {
                background: var(--fortnite);
                color: #1c1917;
            }

            .link-fortnite:hover {
                background: var(--fortnite-hover);
                color: #fff;
            }

            .link-gamedev {
                background: var(--gamedev);
                color: #fff;
            }

            .link-gamedev:hover {
                background: var(--gamedev-hover);
            }

            @media (min-width: 640px) {
                h1 {
                    font-size: 2.25rem;
                }

                .subtitle {
                    font-size: 1rem;
                }

                .links {
                    flex-direction: row;
                    flex-wrap: wrap;
                }

                .link {
                    flex: 1 1 calc(50% - 0.5rem);
                }
            }
        </style>
    </head>
    <body>
        <main>
            <div class="panel">
                <h1>Alessandro Bettini applications</h1>
                <img
                    class="hero"
                    src="hero.jpg"
                    alt="Alessandro Bettini applications"
                    width="448"
                    height="256"
                />
                <p class="subtitle">Accedi all'applicazione.</p>
                <div class="links">
                    <a class="link link-outdoor" href="https://climbtracker-ui.alebettini.com/">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="m8 3 4 8 5-5 5 15H2L8 3z" />
                        </svg>
                        Accedi ad outdoor tracker
                    </a>
                    <a class="link link-dnd" href="https://dnd-wiki.alebettini.com/">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                            <path
                                d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
                            />
                        </svg>
                        DnD Wiki
                    </a>
                    <a
                        class="link link-fortnite"
                        href="https://alebettini28.github.io/fortnite-tracker/"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M6 12h4" />
                            <path d="M8 10v4" />
                            <path d="M15 13h.01" />
                            <path d="M18 11h.01" />
                            <rect width="20" height="12" x="2" y="6" rx="2" />
                        </svg>
                        Fortnite Tracker
                    </a>
                    <a class="link link-gamedev" href="https://gamedev-portfolio.alebettini.com/">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <polyline points="16 18 22 12 16 6" />
                            <polyline points="8 6 2 12 8 18" />
                        </svg>
                        Gamedev portfolio
                    </a>
                </div>
            </div>
        </main>
    </body>
</html>
